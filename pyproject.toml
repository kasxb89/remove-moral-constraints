[build-system]
requires = ["setuptools>=75.3.2,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-patcher"
dynamic = ["version"]
description = "Local session management and global prompt configuration for Claude Code"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "kasxb89", email = "kasxbls@163.com"}
]
keywords = ["claude-code", "cli", "session", "patcher"]
dependencies = []

[project.scripts]
claude-patcher = "codex_session_patcher.cli:main"
claude-patcher-web = "web.backend.main:run_server"

[tool.setuptools.packages.find]
include = ["codex_session_patcher*", "web*"]

[tool.setuptools.dynamic]
version = {attr = "codex_session_patcher.__version__"}

[tool.setuptools.package-data]
codex_session_patcher = ["ctf_config/prompts/*.md"]
web = [
    "frontend/dist/*",
    "frontend/dist/assets/*",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "httpx>=0.24.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
build = [
    "pyinstaller>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
